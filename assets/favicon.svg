<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- HA mark, optimized for small sizes — slightly thicker strokes for favicon legibility -->
  <!-- H left vertical -->
  <line x1="11" y1="5" x2="6"  y2="59" stroke="#C47B3A" stroke-width="8" stroke-linecap="round"/>
  <!-- H right / A left (shared, apex at top) -->
  <line x1="27" y1="5" x2="22" y2="59" stroke="#C47B3A" stroke-width="8" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="6"  y1="33" x2="29" y2="33" stroke="#C47B3A" stroke-width="8" stroke-linecap="round"/>
  <!-- A right leg -->
  <line x1="27" y1="5"  x2="58" y2="59" stroke="#C47B3A" stroke-width="8" stroke-linecap="round"/>
</svg>
